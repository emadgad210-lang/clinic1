    if (state.forgotPasswordStep === 'reset') {
      return `
        <div class="modal-backdrop" data-action="close-modal">
          <div class="modal-card" onclick="event.stopPropagation()">
            <h2>تحديد كلمة سر جديدة</h2>
            <p style="font-size:13px;color:var(--text-2);margin:0 0 14px;">الإجابة صحيحة، اكتب كلمة السر الجديدة اللي عايز تستخدمها.</p>
            <div class="form-group">
              <label>كلمة سر جديدة</label>
              <div class="password-wrapper">
                <input type="password" id="forgotNewPassword">
                <button type="button" class="password-toggle" data-action="toggle-password" data-target="forgotNewPassword" aria-label="إظهار/إخفاء كلمة السر">${eyeIcon(false)}</button>
              </div>
            </div>
            <div class="form-group">
              <label>تأكيد كلمة السر الجديدة</label>
              <div class="password-wrapper">
                <input type="password" id="forgotConfirmPassword">
                <button type="button" class="password-toggle" data-action="toggle-password" data-target="forgotConfirmPassword" aria-label="إظهار/إخفاء كلمة السر">${eyeIcon(false)}</button>
              </div>
            </div>
            <div class="modal-actions">
              <button class="save" data-action="reset-password-via-question">تحديث كلمة السر</button>
              <button class="cancel" data-action="close-modal">إلغاء</button>
            </div>
          </div>
        </div>
      `;
    }
    return `
      <div class="modal-backdrop" data-action="close-modal">
        <div class="modal-card" onclick="event.stopPropagation()">
          <h2>استرجاع كلمة السر</h2>
          <div class="form-group">
            <label>سؤال الأمان</label>
            <p style="font-size:13.5px;color:var(--text-0);margin:0 0 4px;">${esc(s.securityQuestion)}</p>
          </div>
          <div class="form-group">
            <label>إجابتك</label>
            <input type="text" id="forgotAnswerInput" placeholder="اكتب الإجابة">
          </div>
          ${state.forgotPasswordError ? `<p class="login-error">الإجابة مش صحيحة، حاول تاني</p>` : ''}
          <div class="modal-actions">
            <button class="save" data-action="check-security-answer">تحقق</button>
            <button class="cancel" data-action="close-modal">إلغاء</button>
          </div>
        </div>
      </div>
    `;
  }
  return '';
}

/* ====================== الرندر الرئيسي ====================== */
function wireLoginField() {
  const input = document.getElementById('loginPassword');
  if (!input) return;
  input.focus();
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const btn = document.querySelector('[data-action="do-login"]');
      if (btn) btn.click();
    }
  });
}

function wireSearch(inputId, stateKey) {
  const input = document.getElementById(inputId);
  if (!input) return;
  input.addEventListener('input', (e) => {
    state[stateKey] = e.target.value;
    render();
    const el = document.getElementById(inputId);
    if (el) { el.focus(); el.selectionStart = el.selectionEnd = el.value.length; }
  });
}

function wireFilter(selectId, stateKey) {
  const select = document.getElementById(selectId);
  if (!select) return;
  select.addEventListener('change', (e) => {
    state[stateKey] = e.target.value;
    render();
  });
}

function render() {
  const app = document.getElementById('app');
  document.body.className = [
    state.theme === 'light' ? 'theme-light' : '',
    state.sidebarOpen ? 'sidebar-locked' : '',
  ].filter(Boolean).join(' ');

  if (!state.auth.loggedIn && state.currentPage !== 'booking') {
    app.innerHTML = renderLogin() + renderModal();
    attachHandlers();
    if (!state.modal) wireLoginField();
    return;
  }

  if (state.auth.loggedIn && state.currentPage !== 'booking' && !isPageAllowed(state.currentPage)) {
    state.currentPage = 'dashboard';
  }

  let body;
  if (state.currentPage === 'booking') {
    body = topNav() + renderBooking();
  } else {
    let pageHtml;
    if (state.pageLoading) pageHtml = renderSkeleton();
    else if (state.currentPage === 'patients') pageHtml = renderPatients();
    else if (state.currentPage === 'patient-detail') pageHtml = renderPatientDetail();
    else if (state.currentPage === 'doctors') pageHtml = renderDoctors();
    else if (state.currentPage === 'settings') pageHtml = renderSettings();
    else if (state.currentPage === 'backup') pageHtml = renderBackup();
    else if (state.currentPage === 'calendar') pageHtml = renderCalendar();
    else if (state.currentPage === 'billing') pageHtml = renderBilling();
    else if (state.currentPage === 'expenses') pageHtml = renderExpenses();
    else if (state.currentPage === 'reports') pageHtml = renderReports();
    else if (state.currentPage === 'activity-log') pageHtml = renderActivityLog();
    else pageHtml = renderDashboard();

    body = topNav(true) + `<div class="container">${sidebar()}${pageHtml}</div>`;
  }
  app.innerHTML = body + renderModal();
  attachHandlers();

  // ربط حقول البحث (المواعيد / المرضى / الأطباء)
  wireSearch('apptSearch', 'apptQuery');
  wireSearch('patientSearch', 'patientQuery');
  wireSearch('doctorSearch', 'doctorQuery');
  wireSearch('expenseSearch', 'expenseQuery');
  wireSearch('billingSearch', 'billingQuery');

  // ربط قوائم الفلترة
  wireFilter('apptStatusFilter', 'apptStatusFilter');
  wireFilter('apptDateFilter', 'apptDateFilter');
  wireFilter('patientStatusFilter', 'patientStatusFilter');
  wireFilter('doctorStatusFilter', 'doctorStatusFilter');
  wireFilter('billingStatusFilter', 'billingStatusFilter');
  wireFilter('expenseTypeFilter', 'expenseTypeFilter');
  wireFilter('expenseStatusFilter', 'expenseStatusFilter');

  if (state.currentPage === 'settings') {
    const logoInput = document.getElementById('logoUpload');
    if (logoInput) {
      logoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.settings.logo = reader.result;
          render();
        };
        reader.readAsDataURL(file);
      });
    }

  }

  if (state.currentPage === 'backup') {
    const importBtn = document.getElementById('importBackupBtn');
    const importInput = document.getElementById('importBackupInput');
    if (importBtn && importInput) {
      importBtn.addEventListener('click', () => importInput.click());
      importInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let data;
          try {
            data = JSON.parse(reader.result);
          } catch (err) {
            state.importNotice = { type: 'error', text: 'الملف ده مش ملف نسخة احتياطية صالح.' };
            render();
            return;
          }
          const looksValid = data && typeof data === 'object' &&
            Array.isArray(data.doctors) && Array.isArray(data.patients) &&
            Array.isArray(data.appointments) && Array.isArray(data.services) &&
            data.settings && typeof data.settings === 'object';
          // ملاحظة: state.expenses حقل أحدث؛ الملفات القديمة من غير بيانات رواتب/مصروفات لسه تُعتبر صالحة
          if (!looksValid) {
            state.importNotice = { type: 'error', text: 'الملف ده مش ملف نسخة احتياطية صالح لتطبيق العيادة.' };
            render();
            return;
          }
          state.pendingImportData = data;
          state.modal = { type: 'import-confirm' };
          render();
        };
        reader.readAsText(file);
      });
    }
  }

  if (state.currentPage === 'booking') {
    const dateInput = document.getElementById('bookingDate');
    if (dateInput) {
      dateInput.addEventListener('change', (e) => {
        state.booking.dateValue = e.target.value;
        if (e.target.value) {
          const date = new Date(e.target.value);
          const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
          const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
          state.booking.dateLabel = `${days[date.getDay()]} ${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        } else {
          state.booking.dateLabel = null;
        }
        render();
      });
    }
    ['bookingHour', 'bookingMinute', 'bookingPeriod'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', (e) => {
        if (id === 'bookingHour') state.booking.hour = e.target.value;
        if (id === 'bookingMinute') state.booking.minute = e.target.value;
        if (id === 'bookingPeriod') state.booking.period = e.target.value;
        render();
      });
    });
    ['bookingName', 'bookingPhone'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', (e) => {
        if (id === 'bookingName') state.booking.name = e.target.value;
        if (id === 'bookingPhone') state.booking.phone = e.target.value;
      });
    });
  }

  if (state.modal && state.modal.type === 'appointment') {
    const patientSelect = document.getElementById('formApptPatientSelect');
    if (patientSelect) {
      patientSelect.addEventListener('change', (e) => {
        const val = e.target.value;
        state.modal.selectedPatientId = val === '__new__' ? '' : val;
        state.modal.newPatientMode = val === '__new__';
        render();
      });
    }
    const newNameInput = document.getElementById('formApptNewPatientName');
    if (newNameInput) {
      newNameInput.addEventListener('input', (e) => { state.modal.newPatientName = e.target.value; });
    }
    const newPhoneInput = document.getElementById('formApptNewPatientPhone');
    if (newPhoneInput) {
      newPhoneInput.addEventListener('input', (e) => { state.modal.newPatientPhone = e.target.value; });
    }
    const doctorSelect = document.getElementById('formApptDoctor');
    const timeInput = document.getElementById('formApptTime');
    const scheduleHint = document.getElementById('apptDoctorScheduleHint');
    if (doctorSelect && timeInput && scheduleHint) {
      const applyDoctorSchedule = () => {
        const opt = doctorSelect.options[doctorSelect.selectedIndex];
        if (!opt || !opt.value) { scheduleHint.textContent = ''; timeInput.removeAttribute('min'); timeInput.removeAttribute('max'); return; }
        const from = opt.dataset.from || '09:00';
        const to = opt.dataset.to || '21:00';
        const days = opt.dataset.days ? opt.dataset.days.split('،').filter(Boolean) : [];
        timeInput.min = from;
        timeInput.max = to;
        scheduleHint.textContent = `مواعيد الطبيب: ${days.length ? days.join('، ') : 'كل الأيام'} · من ${from} إلى ${to}`;
      };
      doctorSelect.addEventListener('change', applyDoctorSchedule);
      applyDoctorSchedule();
    }
    const visitTypeSelect = document.getElementById('formApptVisitType');
    if (visitTypeSelect) {
      visitTypeSelect.addEventListener('change', (e) => { state.modal.visitType = e.target.value; });
    }
  }
}

/* ====================== معالجة الأحداث (Event delegation) ====================== */
function attachHandlers() {
  document.querySelectorAll('[data-page]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const targetPage = el.dataset.page;
      const isSidebarNav = el.classList.contains('nav-item') && state.auth.loggedIn && targetPage !== state.currentPage;
      state.currentPage = targetPage;
      state.sidebarOpen = false;
      if (state.currentPage !== 'booking') {
        state.booking = { service: null, visitType: null, doctorId: null, date: null, done: false };
      }
      if (isSidebarNav) {
        state.pageLoading = true;
        render();
        setTimeout(() => {
          state.pageLoading = false;
          render();
        }, 320);
      } else {
        render();
      }
    });
  });

  document.querySelectorAll('[data-action]').forEach((el) => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const action = el.dataset.action;
      const id = el.dataset.id ? Number(el.dataset.id) : null;

      switch (action) {
        case 'toggle-password': {
          const input = document.getElementById(el.dataset.target);
          if (!input) return;
          const nowVisible = input.type === 'password';
          input.type = nowVisible ? 'text' : 'password';
          el.innerHTML = eyeIcon(nowVisible);
          return;
        }

        // حماية إضافية: منع تنفيذ إجراءات إدارية لو المستخدم مسجّل دخول بصلاحيات موظف محدودة
        default: {
          const staffAddOnlyModals = ['open-patient-modal', 'open-expense-modal'];
          const staffBlockedActions = [
            'open-doctor-modal', 'delete-doctor', 'whatsapp-doctor',
            'open-service-modal', 'delete-service',
            'open-expense-modal', 'delete-expense', 'confirm-delete-expense',
            'save-settings', 'toggle-day', 'toggle-doctor-day', 'save-doctor',
            'export-backup', 'confirm-import-backup', 'clear-activity-log', 'confirm-clear-activity-log',
            'delete-appt', 'toggle-paid',
            'open-patient-modal', 'delete-patient', 'confirm-delete-patient', 'view-patient',
          ];
          if (!isAdmin() && staffBlockedActions.includes(action) && !(staffAddOnlyModals.includes(action) && !id)) {
            return; // 'open-patient-modal' و 'open-expense-modal' من غير id (إضافة جديدة) مسموحة للموظف
          }
        }
      }

      const run = () => {
        const shouldRender = performAction(action, el, id);
        if (shouldRender !== false) render();
      };
      if (LOADING_ACTIONS.includes(action) && el.tagName === 'BUTTON' && !el.disabled) {
        runWithLoading(el, run);
      } else {
        run();
      }
    });
  });
}

function performAction(action, el, id) {
      switch (action) {
        case 'whatsapp-patient': {
          const p = state.patients.find((x) => x.id === id);
          if (!p || !p.phone) { showToast('مفيش رقم موبايل مسجل للمريض ده', 'error'); return false; }
          const message = `مرحباً ${p.name}، معاك ${state.settings.clinicName}.`;
          window.open(whatsappUrl(p.phone, message), '_blank');
          return false;
        }
        case 'whatsapp-doctor': {
          const d = state.doctors.find((x) => x.id === id);
          if (!d || !d.phone) { showToast('مفيش رقم موبايل مسجل للطبيب ده', 'error'); return false; }
          const message = `مرحباً ${d.name}، معاك إدارة ${state.settings.clinicName}.`;
          window.open(whatsappUrl(d.phone, message), '_blank');
          return false;
        }
        case 'whatsapp-appt-reminder': {
          const a = state.appointments.find((x) => x.id === id);
          if (!a) return false;
          const patient = state.patients.find((p) => p.name === a.patientName);
          if (!patient || !patient.phone) { showToast('رقم موبايل المريض ده مش متسجل في قائمة المرضى', 'error'); return false; }
          const doctorName = getDoctorName(a.doctorId);
          const message = `مرحباً ${a.patientName}، بنفكرك بموعدك في ${state.settings.clinicName} يوم ${a.date} الساعة ${a.time} مع ${doctorName} (${a.service}).`;
          window.open(whatsappUrl(patient.phone, message), '_blank');
          return false;
        }
        case 'export-excel': {
          exportTableToExcel(el.dataset.target, el.dataset.filename || 'تصدير');
          return false;
        }
        case 'export-pdf': {
          exportTableToPDF(el.dataset.target, el.dataset.filename || 'تصدير', el.dataset.title || '');
          return false;
        }
        case 'download-invoice': {
          downloadInvoicePDF(id);
          return false;
        }
        case 'export-backup': {
          const backup = {
            type: 'clinic-app-backup',
            version: 1,
            exportedAt: new Date().toISOString(),
            doctors: state.doctors,
            patients: state.patients,
            appointments: state.appointments,
            services: state.services,
            expenses: state.expenses,
            settings: state.settings,
            nextId: state.nextId,
          };
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const dateStr = new Date().toISOString().slice(0, 10);
          const safeName = (state.settings.clinicName || 'clinic').replace(/[\\/:*?"<>|]/g, '');
          const a = document.createElement('a');
          a.href = url;
          a.download = `نسخة-احتياطية-${safeName}-${dateStr}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          return false;
        }
        case 'open-patient-modal':
          state.modal = { type: 'patient', editingId: id || null };
          break;
        case 'open-doctor-modal': {
          const existingDoctor = id ? state.doctors.find((d) => d.id === id) : null;
          state.modal = {
            type: 'doctor',
            editingId: id || null,
            workingDays: existingDoctor ? [...(existingDoctor.workingDays || allDays)] : [...allDays],
          };
          break;
        }
        case 'open-appointment-modal':
          state.modal = { type: 'appointment', editingId: null, selectedPatientId: '', newPatientMode: false, newPatientName: '', newPatientPhone: '', visitType: 'عادي' };
          break;
        case 'close-modal':
          state.modal = null;
          state.pendingImportData = null;
          state.forgotPasswordStep = 'question';
          state.forgotPasswordError = false;
          break;

        case 'dismiss-login-notice':
          state.loginNotice = null;
          break;

        case 'open-forgot-password':
          state.modal = { type: 'forgot-password' };
          state.forgotPasswordStep = 'question';
          state.forgotPasswordError = false;
          break;

        case 'check-security-answer': {
          const attempt = document.getElementById('forgotAnswerInput').value.trim().toLowerCase();
          const correct = state.settings.securityAnswer.trim().toLowerCase();
          if (attempt && attempt === correct) {
            state.forgotPasswordStep = 'reset';
            state.forgotPasswordError = false;
          } else {
            state.forgotPasswordError = true;
          }
          break;
        }
        case 'reset-password-via-question': {
          const newPassword = document.getElementById('forgotNewPassword').value.trim();
          const confirmPassword = document.getElementById('forgotConfirmPassword').value.trim();
          if (!newPassword || !confirmPassword) { showToast('من فضلك املأ كلمة السر الجديدة وتأكيدها', 'error'); return false; }
          if (newPassword !== confirmPassword) { showToast('كلمة السر الجديدة وتأكيدها غير متطابقين', 'error'); return false; }
          if (newPassword.length < 4) { showToast('كلمة السر الجديدة قصيرة جدًا (٤ حروف على الأقل)', 'error'); return false; }
          state.settings.password = newPassword;
          state.modal = null;
          state.forgotPasswordStep = 'question';
          state.forgotPasswordError = false;
          state.loginNotice = { type: 'success', text: 'تم تغيير كلمة السر بنجاح، سجّل دخولك بيها دلوقتي.' };
          logActivity('تم تغيير كلمة السر عن طريق سؤال الأمان (نسيت كلمة السر).');
          break;
        }

        case 'dismiss-import-notice':
          state.importNotice = null;
          break;

        case 'dismiss-settings-notice':
          state.settingsNotice = null;
          break;

        case 'confirm-import-backup': {
          const data = state.pendingImportData;
          if (data) {
            state.doctors = data.doctors;
            state.patients = data.patients;
            state.appointments = data.appointments;
            state.services = data.services;
            state.expenses = Array.isArray(data.expenses) ? data.expenses : [];
            state.settings = { ...state.settings, ...data.settings };
            if (data.nextId && typeof data.nextId === 'object') {
              state.nextId = { ...state.nextId, ...data.nextId };
            }
          }
          state.pendingImportData = null;
          state.modal = null;
          state.currentPage = 'backup';
          state.importNotice = { type: 'success', text: 'تم استيراد النسخة الاحتياطية بنجاح.' };
          logActivity('تم استيراد نسخة احتياطية جديدة، وتم استبدال بيانات العيادة بالكامل.');
          break;
        }

        case 'save-patient': {
          const name = document.getElementById('formPatientName').value.trim();
          const phone = document.getElementById('formPatientPhone').value.trim();
          
          if (!validateName(name)) { 
            showToast('الاسم يجب أن يكون أكثر من حرفين', 'error'); 
            return false; 
          }
          if (!validatePhone(phone)) { 
            showToast('رقم الموبايل غير صحيح (10-11 رقم)', 'error'); 
            return false; 
          }
          
          if (id) {
            const p = state.patients.find((x) => x.id === id);
            p.name = name; p.phone = phone; p.initials = initials(name);
            logActivity(`تم تعديل بيانات المريض: ${name}`);
          } else {
            state.patients.push({ id: state.nextId.patient++, name, phone, initials: initials(name), visits: 0, lastVisit: '—', status: 'active', allergies: '', chronicConditions: '', medicalHistory: [] });
            logActivity(`تم إضافة مريض جديد: ${name}`);
          }
          state.modal = null;
          saveState();
          break;
        }
        case 'delete-patient':
          state.modal = { type: 'confirm', message: 'متأكد إنك عايز تحذف المريض ده؟', confirmAction: 'confirm-delete-patient', targetId: id };
          break;
        case 'confirm-delete-patient': {
          const p = state.patients.find((x) => x.id === id);
          state.patients = state.patients.filter((p) => p.id !== id);
          state.modal = null;
          if (p) logActivity(`تم حذف المريض: ${p.name}`);
          saveState();
          break;
        }

        case 'view-patient':
          state.selectedPatientId = id;
          state.currentPage = 'patient-detail';
          break;
        case 'back-to-patients':
          state.currentPage = 'patients';
          break;
        case 'save-patient-notes': {
          const p = state.patients.find((x) => x.id === id);
          if (p) {
            const notesEl = document.getElementById('patientConditionsInput');
            const allergiesEl = document.getElementById('patientAllergiesInput');
            p.chronicConditions = notesEl ? notesEl.value.trim() : p.chronicConditions;
            p.allergies = allergiesEl ? allergiesEl.value.trim() : p.allergies;
          }
          break;
        }
        case 'open-medical-modal':
          state.modal = { type: 'medical', patientId: id };
          break;
        case 'save-medical-entry': {
          const title = document.getElementById('formMedicalTitle').value.trim();
          const dateRaw = document.getElementById('formMedicalDate').value;
          const note = document.getElementById('formMedicalNote').value.trim();
          if (!title || !note) { showToast('من فضلك أدخل العنوان والملاحظات', 'error'); return false; }
          const date = dateRaw ? formatArabicDate(dateRaw) : 'الأحد ٦ سبتمبر ٢٠٢٦';
          const p = state.patients.find((x) => x.id === id);
          if (p) p.medicalHistory.push({ id: state.nextId.medicalEntry++, date, title, note });
          state.modal = null;
          break;
        }
        case 'delete-medical-entry': {
          const patientId = Number(el.dataset.patient);
          const p = state.patients.find((x) => x.id === patientId);
          if (p) p.medicalHistory = p.medicalHistory.filter((m) => m.id !== id);
          break;
        }

        case 'save-doctor': {
          const name = document.getElementById('formDoctorName').value.trim();
          const specialty = document.getElementById('formDoctorSpecialty').value.trim();
          const phone = document.getElementById('formDoctorPhone').value.trim();
          const status = document.getElementById('formDoctorStatus').value;
          const workingFrom = document.getElementById('formDoctorFrom').value || '09:00';
          const workingTo = document.getElementById('formDoctorTo').value || '21:00';
          const workingDays = [...state.modal.workingDays];
          
          if (!validateName(name)) { 
            showToast('الاسم يجب أن يكون أكثر من حرفين', 'error'); 
            return false; 
          }
          if (!validateName(specialty)) { 
            showToast('التخصص يجب أن يكون أكثر من حرفين', 'error'); 
            return false; 
          }
          if (phone && !validatePhone(phone)) { 
            showToast('رقم الموبايل غير صحيح', 'error'); 
            return false; 
          }
          if (workingDays.length === 0) {
            showToast('اختار يوم عمل واحد على الأقل للطبيب', 'error');
            return false;
          }
          if (workingFrom >= workingTo) {
            showToast('وقت البداية لازم يكون قبل وقت النهاية', 'error');
            return false;
          }
          
          if (id) {
            const d = state.doctors.find((x) => x.id === id);
            d.name = name; d.specialty = specialty; d.phone = phone; d.status = status; d.initials = initials(name);
            d.workingDays = workingDays; d.workingFrom = workingFrom; d.workingTo = workingTo;
            logActivity(`تم تعديل بيانات الطبيب: ${name}`);
          } else {
            state.doctors.push({ id: state.nextId.doctor++, name, specialty, phone, status, initials: initials(name), workingDays, workingFrom, workingTo });
            logActivity(`تم إضافة طبيب جديد: ${name}`);
          }
          state.modal = null;
          saveState();
          break;
        }
        case 'delete-doctor':
          state.modal = { type: 'confirm', message: 'متأكد إنك عايز تحذف الطبيب ده؟', confirmAction: 'confirm-delete-doctor', targetId: id };
          break;
        case 'confirm-delete-doctor': {
          const d = state.doctors.find((x) => x.id === id);
          state.doctors = state.doctors.filter((d) => d.id !== id);
          state.modal = null;
          if (d) logActivity(`تم حذف الطبيب: ${d.name}`);
          saveState();
          break;
        }

        case 'open-service-modal':
          state.modal = { type: 'service', editingId: id || null };
          break;
        case 'save-service': {
          const name = document.getElementById('formServiceName').value.trim();
          const price = Number(document.getElementById('formServicePrice').value);
          
          if (!validateName(name)) { 
            showToast('اسم الخدمة يجب أن يكون أكثر من حرفين', 'error'); 
            return false; 
          }
          if (!validatePrice(price)) { 
            showToast('السعر يجب أن يكون رقم موجب', 'error'); 
            return false; 
          }
          
          if (id) {
            const sv = state.services.find((x) => x.id === id);
            sv.name = name; sv.price = price;
            logActivity(`تم تعديل الخدمة: ${name} (${formatMoney(price)} جنيه)`);
          } else {
            state.services.push({ id: state.nextId.service++, name, price });
            logActivity(`تم إضافة خدمة جديدة: ${name} (${formatMoney(price)} جنيه)`);
          }
          state.modal = null;
          saveState();
          break;
        }
        case 'delete-service':
          state.modal = { type: 'confirm', message: 'متأكد إنك عايز تحذف الخدمة دي؟', confirmAction: 'confirm-delete-service', targetId: id };
          break;
        case 'confirm-delete-service': {
          const sv = state.services.find((x) => x.id === id);
          state.services = state.services.filter((sv) => sv.id !== id);
          state.modal = null;
          if (sv) logActivity(`تم حذف الخدمة: ${sv.name}`);
          saveState();
          break;
        }

        case 'open-expense-modal':
          state.modal = { type: 'expense', editingId: id || null };
          break;
        case 'save-expense': {
          const exType = document.getElementById('formExpenseType').value;
          const name = document.getElementById('formExpenseName').value.trim();
          const category = document.getElementById('formExpenseCategory').value.trim();
          const amount = Number(document.getElementById('formExpenseAmount').value);
          const dateRaw = document.getElementById('formExpenseDate').value;
          const status = document.getElementById('formExpenseStatus').value;
          const notes = document.getElementById('formExpenseNotes').value.trim();
          
          if (!validateName(name)) { 
            showToast('البيان يجب أن يكون أكثر من حرفين', 'error'); 
            return false; 
          }
          if (!validatePrice(amount)) { 
            showToast('المبلغ يجب أن يكون رقم موجب', 'error'); 
            return false; 
          }
          
          const typeText = exType === 'salary' ? 'راتب' : 'مصروف';
          if (id) {
            const ex = state.expenses.find((x) => x.id === id);
            const date = dateRaw ? formatArabicDate(dateRaw) : ex.date;
            ex.type = exType; ex.name = name; ex.category = category; ex.amount = amount;
            ex.date = date; ex.dateISO = dateRaw || ex.dateISO; ex.status = status; ex.notes = notes;
            logActivity(`تم تعديل ${typeText}: ${name}`);
          } else {
            const date = dateRaw ? formatArabicDate(dateRaw) : 'الأحد ٦ سبتمبر ٢٠٢٦';
            state.expenses.push({ id: state.nextId.expense++, type: exType, name, category, amount, date, dateISO: dateRaw || null, status, notes });
            logActivity(`تم إضافة ${typeText} جديد: ${name} (${formatMoney(amount)} جنيه)`);
          }
          state.modal = null;
          saveState();
          break;
        }
        case 'toggle-expense-paid': {
          const ex = state.expenses.find((x) => x.id === id);
          ex.status = ex.status === 'paid' ? 'pending' : 'paid';
          logActivity(`تم تسجيل ${ex.name} كـ${ex.status === 'paid' ? 'مدفوع' : 'معلّق'}`);
          break;
        }
        case 'delete-expense':
          state.modal = { type: 'confirm', message: 'متأكد إنك عايز تحذف السجل ده؟', confirmAction: 'confirm-delete-expense', targetId: id };
          break;
        case 'confirm-delete-expense': {
          const ex = state.expenses.find((x) => x.id === id);
          state.expenses = state.expenses.filter((x) => x.id !== id);
          state.modal = null;
          if (ex) logActivity(`تم حذف ${ex.type === 'salary' ? 'راتب' : 'مصروف'}: ${ex.name}`);
          saveState();
          break;
        }

        case 'toggle-day': {
          const day = el.dataset.day;
          const days = state.settings.workingDays;
          if (days.includes(day)) {
            state.settings.workingDays = days.filter((d) => d !== day);
          } else {
            state.settings.workingDays = [...days, day];
          }
          break;
        }
        case 'toggle-doctor-day': {
          const day = el.dataset.day;
          const days = state.modal.workingDays;
          if (days.includes(day)) {
            state.modal.workingDays = days.filter((d) => d !== day);
          } else {
            state.modal.workingDays = [...days, day];
          }
          break;
        }
        case 'save-settings': {
          const name = document.getElementById('clinicNameInput').value.trim();
          const currentPassword = document.getElementById('clinicPasswordCurrent').value.trim();
          const newPassword = document.getElementById('clinicPasswordNew').value.trim();
          const confirmPassword = document.getElementById('clinicPasswordConfirm').value.trim();
          const securityQuestion = document.getElementById('securityQuestionSelect').value;
          const securityAnswer = document.getElementById('securityAnswerInput').value.trim();
          const staffPassword = document.getElementById('clinicStaffPassword').value.trim();
          const from = document.getElementById('workingFrom').value;
          const to = document.getElementById('workingTo').value;
          if (!name) { showToast('من فضلك أدخل اسم العيادة', 'error'); return false; }
          if (!currentPassword) { showToast('من فضلك أدخل كلمة سر لوحة التحكم الحالية', 'error'); return false; }
          if (currentPassword !== state.settings.password) { showToast('كلمة السر الحالية غير صحيحة', 'error'); return false; }
          if (newPassword || confirmPassword) {
            if (newPassword !== confirmPassword) { showToast('كلمة السر الجديدة وتأكيدها غير متطابقين', 'error'); return false; }
            if (newPassword.length < 4) { showToast('كلمة السر الجديدة قصيرة جدًا (٤ حروف على الأقل)', 'error'); return false; }
          }
          if (!securityAnswer) { showToast('من فضلك أدخل إجابة لسؤال الأمان عشان تقدر تسترجع كلمة السر لو نسيتها', 'error'); return false; }
          if (!staffPassword || staffPassword.length < 4) { showToast('من فضلك أدخل كلمة سر للموظف (٤ حروف على الأقل)', 'error'); return false; }
          if (staffPassword === (newPassword || currentPassword)) { showToast('كلمة سر الموظف لازم تكون مختلفة عن كلمة سر المدير', 'error'); return false; }
          state.settings.clinicName = name;
          state.settings.password = newPassword || currentPassword;
          state.settings.securityQuestion = securityQuestion;
          state.settings.securityAnswer = securityAnswer;
          state.settings.staffPassword = staffPassword;
          state.settings.workingFrom = from;
          state.settings.workingTo = to;
          state.settingsNotice = { type: 'success', text: 'تم حفظ الإعدادات بنجاح.' };
          logActivity(newPassword ? 'تم حفظ الإعدادات مع تغيير كلمة السر.' : 'تم حفظ الإعدادات.');
          break;
        }

        case 'do-login': {
          const input = document.getElementById('loginPassword');
          const val = input ? input.value : '';
          if (val === state.settings.password) {
            state.auth.loggedIn = true;
            state.auth.role = 'admin';
            state.loginError = false;
            state.currentPage = 'dashboard';
            logActivity('تم تسجيل الدخول إلى لوحة التحكم (صلاحيات كاملة).');
          } else if (val && val === state.settings.staffPassword) {
            state.auth.loggedIn = true;
            state.auth.role = 'staff';
            state.loginError = false;
            state.currentPage = 'dashboard';
            logActivity('تم تسجيل دخول موظف بصلاحيات محدودة (حجز مواعيد).');
          } else {
            state.loginError = true;
          }
          break;
        }
        case 'logout':
          state.auth.loggedIn = false;
          state.auth.role = null;
          state.currentPage = 'dashboard';
          logActivity('تم تسجيل الخروج من لوحة التحكم.');
          break;

        case 'save-appointment': {
          const patientSelectVal = document.getElementById('formApptPatientSelect').value;
          const isNewPatient = patientSelectVal === '__new__';
          let patientName = '';
          let patientPhone = '';

          if (isNewPatient) {
            patientName = document.getElementById('formApptNewPatientName').value.trim();
            patientPhone = document.getElementById('formApptNewPatientPhone')?.value.trim() || '';
          } else if (patientSelectVal) {
            const existingPatient = state.patients.find((p) => p.id === Number(patientSelectVal));
            if (existingPatient) {
              patientName = existingPatient.name;
              patientPhone = existingPatient.phone || '';
            }
          }

          const doctorId = Number(document.getElementById('formApptDoctor').value);
          const visitType = document.getElementById('formApptVisitType').value;
          const service = document.getElementById('formApptService').value;
          const dateRaw = document.getElementById('formApptDate').value;
          const timeRaw = document.getElementById('formApptTime').value;
          const date = formatArabicDate(dateRaw);
          const time = formatArabicTime(timeRaw);
          
          if (!patientName || !doctorId || !date || !time) { 
            showToast('من فضلك أكمل بيانات الموعد (المريض، الطبيب، اليوم، الوقت)', 'error'); 
            return false; 
          }
          
          if (patientPhone && !validatePhone(patientPhone)) {
            showToast('رقم الموبايل غير صحيح (يجب أن يكون 10-11 رقم)', 'error');
            return false;
          }

          const apptDoctor = state.doctors.find((d) => d.id === doctorId);
          const apptDayName = dateISOToArabicDayName(dateRaw);
          if (apptDoctor && apptDoctor.workingDays && apptDoctor.workingDays.length && apptDayName && !apptDoctor.workingDays.includes(apptDayName)) {
            showToast(`${apptDoctor.name} مش متاح يوم ${apptDayName}، أيام عمله: ${apptDoctor.workingDays.join('، ')}`, 'error');
            return false;
          }
          if (apptDoctor) {
            const doctorFrom = apptDoctor.workingFrom || '09:00';
            const doctorTo = apptDoctor.workingTo || '21:00';
            if (timeRaw < doctorFrom || timeRaw >= doctorTo) {
              showToast(`${apptDoctor.name} متاح من ${doctorFrom} إلى ${doctorTo} بس`, 'error');
              return false;
            }
          }

          const timeKey = timeRaw; // input[type=time] بيدي صيغة "HH:MM" جاهزة
          const conflict = findApptConflict(doctorId, dateRaw, timeKey, null);
          if (conflict) {
            const conflictDoctor = state.doctors.find((d) => d.id === doctorId);
            showToast(`الميعاد ده محجوز بالفعل عند ${conflictDoctor ? esc(conflictDoctor.name) : 'الطبيب'} الساعة ${esc(time)}، اختار وقت تاني من فضلك`, 'error');
            return false;
          }

          if (isNewPatient) {
            state.patients.push({
              id: state.nextId.patient++,
              name: patientName,
              phone: patientPhone,
              initials: initials(patientName),
              visits: 0,
              lastVisit: '—',
              status: 'active',
              allergies: '',
              chronicConditions: '',
              medicalHistory: [],
            });
            logActivity(`تم إضافة مريض جديد من شاشة حجز المواعيد: ${patientName}`);
          }
          
          state.appointments.push({ 
            id: state.nextId.appointment++, 
            doctorId, 
            patientName, 
            patientPhone,
            service, 
            visitType,
            date, 
            dateISO: dateRaw, 
            time, 
            timeKey,
            status: 'pending', 
            paid: false 
          });

          state.modal = null;
          logActivity(`تم حجز موعد جديد للمريض: ${patientName}`);
          saveState();
          break;
        }
        case 'confirm-appt': {
          const a = state.appointments.find((a) => a.id === id);
          a.status = 'confirmed';
          const patientForVisit = state.patients.find((p) => p.name === a.patientName);
          if (patientForVisit) {
            patientForVisit.visits = (patientForVisit.visits || 0) + 1;
            patientForVisit.lastVisit = formatArabicDateFull(a.dateISO);
          }
          logActivity(`تم تأكيد موعد: ${a.patientName}`);
          saveState();
          break;
        }
        case 'cancel-appt': {
          const a = state.appointments.find((a) => a.id === id);
          a.status = 'cancelled';
          logActivity(`تم إلغاء موعد: ${a.patientName}`);
          saveState();
          break;
        }
        case 'delete-appt':
          state.modal = { type: 'confirm', message: 'متأكد إنك عايز تحذف الموعد ده؟', confirmAction: 'confirm-delete-appt', targetId: id };
          break;
        case 'confirm-delete-appt': {
          const a = state.appointments.find((a) => a.id === id);
          state.appointments = state.appointments.filter((a) => a.id !== id);
          state.modal = null;
          if (a) logActivity(`تم حذف موعد: ${a.patientName}`);
          saveState();
          break;
        }
        case 'toggle-paid': {
          const a = state.appointments.find((a) => a.id === id);
          a.paid = !a.paid;
          logActivity(`تم تسجيل موعد ${a.patientName} كـ${a.paid ? 'مدفوع' : 'معلّق'}`);
          saveState();
          break;
        }

        case 'calendar-prev-week':
          state.calendarWeekStart = addDaysISO(state.calendarWeekStart, -7);
          break;
        case 'calendar-next-week':
          state.calendarWeekStart = addDaysISO(state.calendarWeekStart, 7);
          break;
        case 'calendar-today':
          state.calendarWeekStart = startOfWeekSaturday('2026-09-06');
          break;

        case 'clear-activity-log':
          state.modal = { type: 'confirm', message: 'متأكد إنك عايز تمسح سجل النشاط بالكامل؟', confirmAction: 'confirm-clear-activity-log', targetId: null };
          break;
        case 'confirm-clear-activity-log':
          state.activityLog = [];
          state.modal = null;
          break;

        case 'select-service':
          state.booking.service = el.dataset.value;
          break;
        case 'select-visit-type':
          state.booking.visitType = el.dataset.value;
          break;
        case 'select-doctor':
          state.booking.doctorId = id;
          // لو غيّر الطبيب، نفضّي الوقت المختار عشان يتفلتر على مواعيد الطبيب الجديد
          state.booking.hour = null;
          state.booking.minute = null;
          state.booking.period = null;
          break;
        case 'confirm-booking': {
          const b = state.booking;
          if (!b.visitType) { showToast('اختر نوع الكشف من فضلك', 'error'); return false; }
          if (!b.service) { showToast('اختر الخدمة من فضلك', 'error'); return false; }
          if (!b.doctorId) { showToast('اختر الطبيب من فضلك', 'error'); return false; }
          if (!b.dateLabel) { showToast('اختر التاريخ من فضلك', 'error'); return false; }
          if (!b.hour || !b.minute || !b.period) { showToast('اختر الوقت بالكامل من فضلك', 'error'); return false; }
          if (!validateName(b.name)) { showToast('الاسم يجب أن يكون أكثر من حرفين', 'error'); return false; }
          if (!validatePhone(b.phone)) { showToast('رقم الموبايل غير صحيح', 'error'); return false; }

          const bookingDoctor = state.doctors.find((d) => d.id === b.doctorId);
          const bookingDayName = dateISOToArabicDayName(b.dateValue);
          if (bookingDoctor && bookingDoctor.workingDays && bookingDoctor.workingDays.length && bookingDayName && !bookingDoctor.workingDays.includes(bookingDayName)) {
            showToast(`${bookingDoctor.name} مش متاح يوم ${bookingDayName}، أيام عمله: ${bookingDoctor.workingDays.join('، ')}`, 'error');
            return false;
          }

          const bookingTimeKey = to24HourKey(b.hour, b.minute, b.period);
          if (bookingDoctor) {
            const doctorFrom = bookingDoctor.workingFrom || '09:00';
            const doctorTo = bookingDoctor.workingTo || '21:00';
            if (bookingTimeKey < doctorFrom || bookingTimeKey >= doctorTo) {
              showToast(`${bookingDoctor.name} متاح من ${doctorFrom} إلى ${doctorTo} بس، اختار وقت في النطاق ده`, 'error');
              return false;
            }
          }
          const bookingConflict = findApptConflict(b.doctorId, b.dateValue, bookingTimeKey, null);
          if (bookingConflict) {
            showToast('المعاد ده محجوز عند الدكتور، من فضلك اختر وقت تاني', 'error');
            return false;
          }

          state.appointments.push({
            id: state.nextId.appointment++,
            doctorId: b.doctorId,
            patientName: b.name,
            patientPhone: b.phone,
            service: b.service,
            visitType: b.visitType,
            date: b.dateLabel,
            dateISO: b.dateValue || null,
            time: `${b.hour}:${b.minute} ${b.period}`,
            timeKey: bookingTimeKey,
            status: 'pending',
            paid: false,
          });
          state.booking = { service: null, visitType: null, doctorId: null, date: null, done: true };
          logActivity(`حجز جديد من صفحة الحجز العامة: ${b.name}`);
          saveState();
          break;
        }
        case 'booking-new':
          state.booking = { service: null, visitType: null, doctorId: null, date: null, done: false };
          break;

        case 'toggle-theme':
          state.theme = state.theme === 'light' ? 'dark' : 'light';
          break;

        case 'toggle-sidebar':
          state.sidebarOpen = !state.sidebarOpen;
          break;
        case 'close-sidebar':
          state.sidebarOpen = false;
          break;
      }
  return true;
}

render();
</script>
</body>
</html>
