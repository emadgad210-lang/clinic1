<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>عيادة النور — نظام الحجز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0B1615; --bg-1:#101F1D; --bg-2:#152925; --bg-3:#1B332E;
    --teal:#3FA98C; --teal-wash:rgba(63,169,140,0.12);
    --amber:#D6A24C; --amber-wash:rgba(214,162,76,0.14);
    --rust:#C97456; --rust-wash:rgba(201,116,86,0.14);
    --line:#22332F; --line-strong:#324743;
    --text-0:#F3F7F5; --text-1:#C7D6D1; --text-2:#8AA39C;
    --teal-text:#BFE9DA; --amber-text:#EFD09C; --rust-text:#E6BBAB;
    --shadow:none;
    --radius:12px;
  }
  body.theme-light{
    --bg-0:#F6F8F7; --bg-1:#FFFFFF; --bg-2:#EFF3F1; --bg-3:#E6ECE9;
    --teal:#2C8F73; --teal-wash:rgba(44,143,115,0.10);
    --amber:#B8811F; --amber-wash:rgba(184,129,31,0.12);
    --rust:#B4593B; --rust-wash:rgba(180,89,59,0.12);
    --line:#E1E7E4; --line-strong:#CBD5D1;
    --text-0:#132420; --text-1:#3D544D; --text-2:#6F857D;
    --teal-text:#1F7A5C; --amber-text:#8A5F13; --rust-text:#94402A;
    --shadow:0 1px 2px rgba(19,36,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;background:var(--bg-0);color:var(--text-0);-webkit-font-smoothing:antialiased;transition:background-color .25s ease,color .25s ease;}
  body.sidebar-locked{overflow:hidden;}
  body, .topnav, .sidebar, .table-card, .settings-section, .stat, .calendar-day, .calendar-appt,
  .doctor-card, .service-card, .form-group input, .form-group select, .select-field,
  .search-bar, .login-card, .badge, .icon-btn, .nav-item, .day-toggle, .file-btn, .avatar,
  .avatar-sm, .logo-preview, .login-logo{transition:background-color .2s ease,border-color .2s ease,color .2s ease;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  .topnav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--bg-1);flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bg-0);font-size:14px;}
  .brand-name{font-size:15px;font-weight:600;}
  .nav-tabs{display:flex;gap:6px;}
  .nav-tabs a{background:transparent;border:1px solid transparent;color:var(--text-2);padding:8px 18px;border-radius:999px;font-size:13.5px;text-decoration:none;cursor:pointer;}
  .nav-tabs a.active{background:var(--bg-3);border-color:var(--line-strong);color:var(--text-0);font-weight:500;}
  .topnav-actions{display:flex;align-items:center;gap:12px;}
  .theme-toggle{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:var(--bg-2);border:1px solid var(--line-strong);color:var(--text-1);flex-shrink:0;}
  .theme-toggle:hover{color:var(--text-0);border-color:var(--teal);}
  .theme-toggle svg{width:17px;height:17px;}
  .theme-toggle-floating{position:fixed;top:18px;left:18px;z-index:60;}

  .toast-host{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column-reverse;gap:10px;width:min(380px,calc(100vw - 32px));pointer-events:none;}
  .toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;background:var(--bg-1);border:1px solid var(--line-strong);border-inline-start:3px solid var(--teal);border-radius:10px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,0.28);animation:toast-in .25s ease;}
  body.theme-light .toast{box-shadow:0 8px 20px rgba(19,36,32,0.12);}
  .toast-success{border-inline-start-color:var(--teal);}
  .toast-error{border-inline-start-color:var(--rust);}
  .toast-info{border-inline-start-color:var(--amber);}
  .toast-icon{flex-shrink:0;width:19px;height:19px;margin-top:1px;}
  .toast-icon svg{width:100%;height:100%;}
  .toast-success .toast-icon{color:var(--teal);}
  .toast-error .toast-icon{color:var(--rust);}
  .toast-info .toast-icon{color:var(--amber);}
  .toast-text{flex:1;font-size:13px;color:var(--text-0);line-height:1.5;}
  .toast-close{flex-shrink:0;background:none;border:none;color:var(--text-2);font-size:12px;padding:2px 4px;cursor:pointer;}
  .toast-close:hover{color:var(--text-0);}
  @keyframes toast-in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @media (max-width:520px){.toast-host{bottom:14px;}}

  .btn-spinner{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.35);border-top-color:currentColor;animation:spin .7s linear infinite;flex-shrink:0;}
  button.is-loading{display:inline-flex;align-items:center;justify-content:center;gap:8px;opacity:0.85;cursor:progress;}
  .icon-btn.is-loading .btn-spinner,.nav-item.is-loading .btn-spinner{border:2px solid rgba(140,160,155,0.35);border-top-color:var(--text-1);}
  @keyframes spin{to{transform:rotate(360deg);}}

  .skeleton{border-radius:6px;background:linear-gradient(100deg, var(--bg-2) 30%, var(--bg-3) 45%, var(--bg-2) 60%);background-size:250% 100%;animation:skeleton-shine 1.4s ease-in-out infinite;}
  .skeleton-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px;}
  .skeleton-stat{height:78px;border-radius:var(--radius);}
  .skeleton-bar{height:14px;margin-bottom:10px;}
  .skeleton-row{display:flex;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--bg-2);}
  .skeleton-row .skeleton{flex:1;height:14px;}
  .skeleton-row .skeleton:first-child{flex:0 0 32px;height:32px;border-radius:50%;}
  .skeleton-card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  @keyframes skeleton-shine{0%{background-position:200% 0;}100%{background-position:-50% 0;}}
  @media (max-width:700px){.skeleton-stats{grid-template-columns:1fr;}}

  .bar-chart{display:flex;flex-direction:column;gap:13px;}
  .bar-chart-row{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:12px;}
  .bar-chart-label{font-size:12.5px;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-chart-track{background:var(--bg-2);border-radius:999px;height:11px;overflow:hidden;}
  .bar-chart-fill{height:100%;border-radius:999px;transition:width .5s ease;}
  .bar-chart-value{font-size:12px;color:var(--text-2);text-align:left;white-space:nowrap;}
  @media (max-width:520px){.bar-chart-row{grid-template-columns:80px 1fr 38px;gap:8px;}}

  .donut-chart-container{display:flex;align-items:center;justify-content:center;gap:32px;flex-wrap:wrap;padding:6px 0;}
  .donut-chart-wrap{position:relative;width:176px;height:176px;flex-shrink:0;}
  .donut-chart-svg{width:100%;height:100%;display:block;}
  .donut-chart-svg circle{transition:stroke-dasharray .5s ease;}
  .donut-chart-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-chart-total{font-size:24px;font-weight:700;color:var(--text-0);}
  .donut-chart-total-label{font-size:11.5px;color:var(--text-2);margin-top:2px;}
  .donut-legend{display:flex;flex-direction:column;gap:10px;min-width:190px;}
  .donut-legend-item{display:flex;align-items:center;gap:9px;font-size:13px;}
  .donut-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .donut-legend-label{flex:1;color:var(--text-0);font-weight:500;}
  .donut-legend-value{color:var(--text-2);font-size:12px;white-space:nowrap;}

  .vbar-chart{display:flex;align-items:flex-end;gap:16px;height:210px;padding:10px 4px 0;overflow-x:auto;}
  .vbar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:50px;flex:1;}
  .vbar-value{font-size:11.5px;color:var(--text-2);margin-bottom:6px;white-space:nowrap;}
  .vbar-track{width:28px;flex:1;display:flex;align-items:flex-end;background:var(--bg-2);border-radius:6px 6px 0 0;overflow:hidden;}
  .vbar-fill{width:100%;border-radius:6px 6px 0 0;transition:height .5s ease;}
  .vbar-label{font-size:11px;color:var(--text-1);margin-top:8px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
  @media (max-width:520px){.vbar-chart{gap:8px;}.vbar-col{min-width:40px;}}

  .container{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 63px);}
  .sidebar{background:var(--bg-1);border-left:1px solid var(--line);padding:28px 14px;}
  .nav-group-label{font-size:11px;color:var(--text-2);padding:16px 12px 8px;font-weight:500;}
  .nav-group-label:first-child{padding-top:2px;}
  .nav-item{position:relative;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--text-2);margin-bottom:2px;background:transparent;border:none;width:100%;text-align:right;transition:background .15s ease,color .15s ease;}
  .nav-item:hover{background:var(--bg-2);color:var(--text-1);}
  .nav-item.active{background:linear-gradient(90deg, var(--teal-wash), rgba(63,169,140,0.03));color:var(--text-0);font-weight:500;}
  .nav-item.active .nav-icon{color:var(--teal);}
  .nav-item.active::after{content:'';position:absolute;top:8px;bottom:8px;right:4px;width:3px;border-radius:3px;background:var(--teal);}
  .nav-icon{width:18px;height:18px;flex-shrink:0;color:var(--text-2);display:flex;transition:color .15s ease;}
  .nav-icon svg{width:100%;height:100%;}
  .role-hint{background:var(--amber-wash);color:var(--amber-text);font-size:11.5px;padding:10px 12px;border-radius:10px;margin-bottom:16px;text-align:center;line-height:1.5;}

  .hamburger-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line-strong);color:var(--text-1);flex-shrink:0;}
  .hamburger-btn svg{width:18px;height:18px;}
  .sidebar-mobile-head{display:none;align-items:center;justify-content:space-between;padding:2px 6px 18px;font-size:14px;font-weight:600;color:var(--text-0);border-bottom:1px solid var(--line);margin-bottom:12px;}
  .sidebar-close-btn{background:none;border:none;color:var(--text-2);font-size:15px;padding:4px 8px;cursor:pointer;}
  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65;opacity:0;transition:opacity .2s ease;}
  .sidebar-backdrop.show{display:block;opacity:1;}

  .main{padding:30px 34px;position:relative;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:14px;}
  .topbar h1{font-size:21px;font-weight:600;margin:0 0 4px;}
  .topbar .subtitle{font-size:13px;color:var(--text-2);}
  .btn-primary{background:var(--teal);color:var(--bg-0);border:none;padding:11px 20px;border-radius:9px;font-size:13.5px;font-weight:600;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px;}
  .stat{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .stat .label{font-size:12.5px;color:var(--text-2);margin-bottom:8px;}
  .stat .value{font-size:25px;font-weight:600;color:var(--teal);}
  .stat .value.amber{color:var(--amber);}

  .table-card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;overflow-x:auto;}
  .data-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
  .data-table th{text-align:right;padding:13px 16px;color:var(--text-2);font-weight:500;border-bottom:1px solid var(--line);font-size:12.5px;}
  .data-table td{padding:13px 16px;border-bottom:1px solid var(--bg-2);color:var(--text-1);}
  .data-table tr:last-child td{border-bottom:none;}
  .name-cell{display:flex;align-items:center;gap:10px;color:var(--text-0);font-weight:500;}
  .avatar-sm{width:32px;height:32px;border-radius:50%;background:var(--teal-wash);color:var(--teal-text);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0;}
  .badge{padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:500;display:inline-block;}
  .badge.confirmed,.badge.active{background:var(--teal-wash);color:var(--teal-text);}
  .badge.pending{background:var(--amber-wash);color:var(--amber-text);}
  .badge.cancelled,.badge.inactive{background:var(--bg-2);color:var(--text-2);}
  .badge.salary{background:var(--teal-wash);color:var(--teal-text);}
  .badge.expense{background:var(--rust-wash);color:var(--rust-text);}
  .badge.visit-normal{background:var(--bg-2);color:var(--text-1);}
  .badge.visit-urgent{background:var(--rust-wash);color:var(--rust-text);}
  .badge.visit-followup{background:var(--amber-wash);color:var(--amber-text);}
  .search-bar{display:flex;align-items:center;gap:8px;background:var(--bg-1);border:1px solid var(--line);border-radius:9px;padding:9px 14px;margin-bottom:18px;max-width:320px;}
  .search-bar input{background:transparent;border:none;color:var(--text-0);font-size:13.5px;width:100%;outline:none;}
  .search-bar input::placeholder{color:var(--text-2);}
  .list-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px;}
  .list-toolbar .search-bar{margin-bottom:0;}
  .filter-select{background:var(--bg-1);border:1px solid var(--line);color:var(--text-1);font-size:13px;padding:9px 12px;border-radius:9px;min-width:140px;}
  .filter-select:focus{outline:none;border-color:var(--teal);}
  .empty-hint{color:var(--text-2);font-size:13px;padding:24px;text-align:center;}

.settings-section{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:20px;}
.settings-section h2{font-size:15px;font-weight:600;margin:0 0 16px;}
.logo-row{display:flex;align-items:center;gap:16px;}
.logo-preview{width:64px;height:64px;border-radius:12px;background:var(--teal-wash);color:var(--teal-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;overflow:hidden;flex-shrink:0;}
.logo-preview img{width:100%;height:100%;object-fit:cover;}
.file-btn{display:inline-block;background:var(--bg-2);border:1px solid var(--line-strong);color:var(--text-1);padding:9px 16px;border-radius:8px;font-size:13px;}
.file-btn input{display:none;}
.days-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.day-toggle{padding:8px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg-2);color:var(--text-2);font-size:12.5px;}
.day-toggle.on{background:var(--teal-wash);border-color:var(--teal);color:var(--teal-text);}
.hours-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.price-cell{color:var(--amber);font-weight:600;}

  .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;overflow-x:auto;}
  .calendar-day{background:var(--bg-1);border:1px solid var(--line);border-radius:10px;min-width:112px;display:flex;flex-direction:column;}
  .calendar-day-head{padding:6px 8px;font-size:11px;font-weight:600;color:var(--text-0);border-bottom:1px solid var(--line);text-align:center;}
  .calendar-day-body{padding:6px;display:flex;flex-direction:column;gap:5px;min-height:60px;}
  .calendar-appt{background:var(--bg-2);border:1px solid var(--line);border-inline-start:3px solid var(--line-strong);border-radius:6px;padding:5px 7px;}
  .calendar-appt.visit-urgent{border-inline-start-color:var(--rust);}
  .calendar-appt.visit-followup{border-inline-start-color:var(--amber);}
  .calendar-appt-row{display:flex;align-items:baseline;gap:5px;}
  .calendar-appt-time{font-size:10.5px;font-weight:600;color:var(--teal-text);flex-shrink:0;}
  .calendar-appt-name{font-size:11.5px;font-weight:500;color:var(--text-0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .calendar-appt-doctor{font-size:9.5px;color:var(--text-2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .calendar-appt .badge{padding:2px 7px;font-size:9.5px;margin-top:3px;}
  @media (max-width:900px){
    .calendar-grid{grid-template-columns:repeat(7,112px);}
  }

  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .icon-btn{background:transparent;border:1px solid var(--line-strong);color:var(--text-1);padding:6px 12px;border-radius:7px;font-size:12px;white-space:nowrap;}
  .icon-btn.danger{color:var(--rust-text);border-color:rgba(201,116,86,0.4);}
  .icon-btn.confirm{color:var(--teal-text);border-color:rgba(63,169,140,0.4);}
  .icon-btn.whatsapp-general{color:var(--text-1);border-color:var(--line-strong);}
  .icon-btn.whatsapp-reminder{background:rgba(37,211,102,0.12);color:#1f9b57;border-color:rgba(37,211,102,0.45);font-weight:600;}

  /* ===== Booking Page ===== */
  .booking-page{display:flex;justify-content:center;padding:48px 20px 70px;}
  .booking-wrap{max-width:480px;width:100%;}
  .booking-header{text-align:center;margin-bottom:30px;}
  .booking-header h1{font-size:23px;font-weight:600;margin:0 0 6px;}
  .booking-header p{font-size:13.5px;color:var(--text-2);margin:0;}
  .section-label{font-size:13px;color:var(--text-2);margin:0 0 10px;font-weight:500;}

  .service-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:26px;}
  .service-card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;background:var(--bg-1);border:2px solid var(--line);border-radius:var(--radius);transition:all .2s ease;}
  .service-card:hover{border-color:var(--teal);background:var(--bg-2);}
  .service-card.selected{background:var(--teal-wash);border-color:var(--teal);}
  .service-icon{font-size:28px;}
  .service-name{font-size:14px;font-weight:500;color:var(--text-0);text-align:center;}

  .card-list{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;}
  .doctor-card{display:flex;align-items:center;gap:12px;background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;width:100%;text-align:right;}
  .doctor-card.selected{border-color:var(--teal);background:var(--bg-2);}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--teal-wash);color:var(--teal-text);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;}
  .doctor-card h3{font-size:14px;font-weight:500;margin:0 0 2px;color:var(--text-0);}
  .doctor-card p{font-size:12px;color:var(--text-2);margin:0;}

  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;}
  .form-group input,.form-group select,.select-field{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--bg-1);color:var(--text-0);}
  .form-group input::placeholder{color:var(--text-2);}
  .form-group input.field-error,.form-group select.field-error{border-color:var(--rust);background:rgba(201,116,86,0.05);}
  .form-group input:disabled,.form-group select:disabled{opacity:0.6;cursor:not-allowed;}
  .field-error-message{display:none;color:var(--rust-text);font-size:12px;margin-top:4px;}
  .field-error + .field-error-message{display:block;}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-primary:disabled:hover{opacity:0.5;}
  .password-wrapper{position:relative;}
  .password-wrapper input{padding-left:40px;}
  .password-toggle{position:absolute;top:50%;left:8px;transform:translateY(-50%);background:none;border:none;padding:6px;cursor:pointer;color:var(--text-2);display:flex;align-items:center;justify-content:center;border-radius:6px;}
  .password-toggle:hover{color:var(--text-0);}
  .password-toggle svg{width:18px;height:18px;display:block;}
  input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.8);cursor:pointer;}

  .time-picker-group{background:var(--bg-1);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;}

function toIntlPhone(phone) {
  let digits = String(phone || '').replace(/\D/g, '');
  if (digits.startsWith('0')) digits = '20' + digits.slice(1); // مصر: استبدال الصفر بكود الدولة
  return digits;
}
function whatsappUrl(phone, message) {
  const digits = toIntlPhone(phone);
  const text = message ? `?text=${encodeURIComponent(message)}` : '';
  return `https://wa.me/${digits}${text}`;
}
/* ====================== Validation Functions ====================== */
function validatePhone(phone) {
  const cleaned = phone.replace(/\D/g, '');
  return cleaned.length >= 10 && cleaned.length <= 11;
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validateName(name) {
  return name.trim().length >= 2;
}

function validatePrice(price) {
  const num = Number(price);
  return !isNaN(num) && num > 0;
}

/* ====================== منع تعارض المواعيد ====================== */
// يحوّل وقت 12 ساعة (المستخدم في صفحة الحجز العامة: ٩، ١٥/٣٠/٤٥، ص/م) إلى صيغة 24 ساعة موحّدة "HH:MM"
function to24HourKey(hour12, minute, period) {
  let h = Number(hour12) % 12;
  if (period === 'م') h += 12;
  return `${String(h).padStart(2, '0')}:${minute}`;
}

// يدور على أي موعد تاني (غير ملغي) لنفس الطبيب في نفس اليوم ونفس الوقت بالظبط
function findApptConflict(doctorId, dateISO, timeKey, excludeId) {
  if (!doctorId || !dateISO || !timeKey) return null;
  return state.appointments.find((a) =>
    a.doctorId === Number(doctorId) &&
    a.dateISO === dateISO &&
    a.timeKey === timeKey &&
    a.status !== 'cancelled' &&
    a.id !== excludeId
  ) || null;
}

function validateFormField(fieldId, validator) {
  const el = document.getElementById(fieldId);
  if (!el) return false;
  const isValid = validator(el.value);
  el.classList.toggle('field-error', !isValid);
  return isValid;
}

/* ====================== LocalStorage Persistence ====================== */
function saveStateToLocalStorage() {
  try {
    localStorage.setItem('clinicAppState', JSON.stringify(state));
  } catch (e) {
    console.error('خطأ في حفظ البيانات:', e);
  }
}

function loadStateFromLocalStorage() {
  try {
    const saved = localStorage.getItem('clinicAppState');
    if (saved) {
      const loaded = JSON.parse(saved);
      // دمج البيانات المحفوظة مع الحالة الحالية
      Object.assign(state, loaded);
      // توافق: إضافة أي خدمات افتراضية جديدة غير موجودة في البيانات المحفوظة القديمة (بدون مسح بيانات المستخدم)
      const defaultServices = [
        { id: 1, name: 'كشف', price: 150 },
        { id: 2, name: 'متابعة', price: 80 },
        { id: 3, name: 'كشف مستعجل', price: 220 },
      ];
      if (Array.isArray(state.services)) {
        defaultServices.forEach((ds) => {
          const exists = state.services.some((sv) => sv.name === ds.name);
          if (!exists) {
            const maxId = state.services.reduce((m, sv) => Math.max(m, sv.id || 0), 0);
            state.services.push({ id: Math.max(maxId + 1, (state.nextId && state.nextId.service) || 1), name: ds.name, price: ds.price });
            if (state.nextId) state.nextId.service = Math.max((state.nextId.service || 1), maxId + 2);
          }
        });
      }
      return true;
    }
  } catch (e) {
    console.error('خطأ في تحميل البيانات:', e);
  }
  return false;
}

// Save state on every significant action
function saveState() {
  saveStateToLocalStorage();
}

function logActivity(text) {
  state.activityLog.unshift({
    id: state.nextId.activity++,
    time: new Date().toLocaleString('ar-EG', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short', year: 'numeric' }),
    text,
  });
  if (state.activityLog.length > 200) state.activityLog.length = 200;
  showToast(text, 'success');
  saveState(); // حفظ البيانات
}
function showToast(text, type) {
  const id = state.nextId.toast++;
  state.toasts.push({ id, text, type: type || 'error' });
  if (state.toasts.length > 4) state.toasts.shift();
  renderToasts();
  setTimeout(() => {
    state.toasts = state.toasts.filter((t) => t.id !== id);
    renderToasts();
  }, 3800);
}
function renderToasts() {
  const host = document.getElementById('toastHost');
  if (!host) return;
  const icons = {
    success: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
    error: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>`,
    info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>`,
  };
  host.innerHTML = state.toasts.map((t) => `
    <div class="toast toast-${t.type}" data-toast-id="${t.id}">
      <span class="toast-icon">${icons[t.type] || icons.info}</span>
      <span class="toast-text">${esc(t.text)}</span>
      <button type="button" class="toast-close" data-dismiss-toast="${t.id}" aria-label="إغلاق">✕</button>
    </div>
  `).join('');
  host.querySelectorAll('[data-dismiss-toast]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const id = Number(btn.dataset.dismissToast);
      state.toasts = state.toasts.filter((t) => t.id !== id);
      renderToasts();
    });
  });
}

function runWithLoading(el, run) {
  if (el.dataset.loading === '1') return;
  const originalHtml = el.innerHTML;
  el.dataset.loading = '1';
  el.disabled = true;
  el.classList.add('is-loading');
  el.innerHTML = `<span class="btn-spinner"></span><span>جارِ التنفيذ...</span>`;
  setTimeout(() => {
    try {
      run();
    } finally {
      // لو الصفحة اتعاد رسمها (render) هيتشال الزرار القديم من الـ DOM أصلاً؛
      // لو لأي سبب لسه موجود (مفيش render حصل)، نرجّعه لشكله الطبيعي
      if (document.body.contains(el)) {
        el.dataset.loading = '0';
        el.disabled = false;
        el.classList.remove('is-loading');
        el.innerHTML = originalHtml;
      }
    }
  }, 480);
}

// بيرجع أسماء أيام الأسبوع (بالعربي) اللي الطبيب متاح فيها كنص مختصر، أو "" لو الأيام كلها متاحة
function getDoctorScheduleLabel(doctor) {
  if (!doctor) return '';
  const from = doctor.workingFrom || '09:00';
  const to = doctor.workingTo || '21:00';
  const days = (doctor.workingDays && doctor.workingDays.length) ? doctor.workingDays.join('، ') : 'كل الأيام';
  return `${days} · من ${from} إلى ${to}`;
}
function dateISOToArabicDayName(dateISO) {
  if (!dateISO) return null;
  const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const date = new Date(dateISO + 'T00:00:00');
  return days[date.getDay()];
}
function addDaysISO(iso, days) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function startOfWeekSaturday(iso) {
  const d = new Date(iso + 'T00:00:00');
  const sinceSaturday = (d.getDay() + 1) % 7; // getDay: 0=أحد...6=سبت
  return addDaysISO(iso, -sinceSaturday);
}
function formatArabicDateShort(iso) {
  const date = new Date(iso + 'T00:00:00');
  const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  return `${days[date.getDay()]} ${toArabicDigits(date.getDate())} ${months[date.getMonth()]}`;
}
function toArabicDigits(str) {
  const map = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(str).replace(/[0-9]/g, (d) => map[d]);
}
function formatMoney(n) {
  const num = Number(n) || 0;
  return num.toLocaleString('en-US');
}
function formatArabicDate(dateValue) {
  if (!dateValue) return null;
  const date = new Date(dateValue + 'T00:00:00');
  const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  return `${days[date.getDay()]} ${toArabicDigits(date.getDate())} ${months[date.getMonth()]}`;
}
function formatArabicDateFull(dateValue) {
  if (!dateValue) return '—';
  const date = new Date(dateValue + 'T00:00:00');
  const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  return `${toArabicDigits(date.getDate())} ${months[date.getMonth()]} ${toArabicDigits(date.getFullYear())}`;
}
function formatArabicTime(timeValue) {
  if (!timeValue) return null;
  let [h, m] = timeValue.split(':').map(Number);
  const period = h >= 12 ? 'م' : 'ص';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${toArabicDigits(h12)}:${toArabicDigits(String(m).padStart(2, '0'))} ${period}`;
}

// تصدير أي جدول (data-table) موجود في الصفحة الحالية إلى ملف إكسل حقيقي
function exportTableToExcel(tableId, filename) {
  const container = document.getElementById(tableId);
  const table = container ? container.querySelector('table') : null;
  if (!table) { showToast('الجدول غير موجود للتصدير', 'error'); return; }
  try {
    const cleanTable = table.cloneNode(true);
    cleanTable.querySelectorAll('.no-export').forEach((el) => el.remove());
    const wb = XLSX.utils.table_to_book(cleanTable, { sheet: 'الجدول' });
    const ws = wb.Sheets['الجدول'];
    ws['!cols'] = Object.keys(ws)
      .filter((k) => /^[A-Z]+1$/.test(k))
      .map(() => ({ wch: 22 }));
    if (!wb.Workbook) wb.Workbook = {};
    wb.Workbook.Views = [{ RTL: true }];
    XLSX.writeFile(wb, `${filename}.xlsx`);
    showToast('تم تصدير ملف الإكسل بنجاح', 'success');
  } catch (err) {
    showToast('حصل خطأ أثناء تصدير الإكسل', 'error');
  }
}

// تصدير أي جدول (data-table) إلى ملف PDF (صورة مطبوعة من الجدول، فتدعم العربي بشكل صحيح)
async function exportTableToPDF(tableId, filename, title) {
  const container = document.getElementById(tableId);
  if (!container) { showToast('الجدول غير موجود للتصدير', 'error'); return; }
  const wrapper = document.createElement('div');
  wrapper.style.cssText = `position:fixed;top:-99999px;left:-99999px;width:${Math.max(container.offsetWidth, 500) + 48}px;padding:24px;direction:rtl;font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;`;
  applyPrintPalette(wrapper);
  wrapper.style.background = 'var(--bg-1)';
  const heading = document.createElement('div');
  heading.style.cssText = 'margin-bottom:4px;color:var(--text-0);font-size:18px;font-weight:700;';
  heading.textContent = title || '';
  const dateLine = document.createElement('div');
  dateLine.style.cssText = 'margin-bottom:16px;color:var(--text-2);font-size:12px;';
  dateLine.textContent = `اسم العيادة: ${state.settings.clinicName} — تاريخ التصدير: ${new Date().toLocaleDateString('ar-EG')}`;
  const clone = container.cloneNode(true);
  clone.style.overflow = 'visible';
  clone.querySelectorAll('.no-export').forEach((el) => el.remove());
  wrapper.appendChild(heading);
  wrapper.appendChild(dateLine);
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);
  try {
    const canvas = await html2canvas(wrapper, { scale: 2, backgroundColor: '#ffffff' });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const margin = 10;
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth - margin * 2;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL('image/png');
    let heightLeft = imgHeight;
    let position = margin;
    pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
    heightLeft -= (pageHeight - margin * 2);
    while (heightLeft > 0) {
      position = margin - (imgHeight - heightLeft);
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', margin, position, imgWidth, imgHeight);
      heightLeft -= (pageHeight - margin * 2);
    }
    pdf.save(`${filename}.pdf`);
    showToast('تم تصدير ملف PDF بنجاح', 'success');
  } catch (err) {
    showToast('حصل خطأ أثناء تصدير PDF', 'error');
  } finally {
    wrapper.remove();
  }
}

/* ====================== رسم بياني بسيط (Bar Chart) ====================== */
function renderBarChart(data, opts) {
  // data: [{ label, value, color? }]
  const options = opts || {};
  const max = Math.max(1, ...data.map((d) => d.value));
  if (data.length === 0) {
    return `<div class="empty-hint">مفيش بيانات كفاية لعرض الرسم البياني</div>`;
  }
  return `
    <div class="bar-chart">
      ${data.map((d) => {
        const pct = Math.max(d.value > 0 ? 4 : 0, Math.round((d.value / max) * 100));
        const color = d.color || 'var(--teal)';
        return `
        <div class="bar-chart-row">
          <div class="bar-chart-label" title="${esc(d.label)}">${esc(d.label)}</div>
          <div class="bar-chart-track">
            <div class="bar-chart-fill" style="width:${pct}%;background:${color};"></div>
          </div>
          <div class="bar-chart-value">${esc(String(d.value))}${options.unit ? ` ${options.unit}` : ''}</div>
        </div>
      `;
      }).join('')}
    </div>
  `;
}

/* ====================== رسم دائري (Donut) ====================== */
function renderDonutChart(data, opts) {
  // data: [{ label, value, color? }]
  const options = opts || {};
  const total = data.reduce((sum, d) => sum + d.value, 0);
  if (total === 0) {
    return `<div class="empty-hint">مفيش بيانات كفاية لعرض الرسم البياني</div>`;
  }
  const size = 176;
  const stroke = 26;
  const r = (size - stroke) / 2;
  const cx = size / 2;
  const cy = size / 2;
  const circumference = 2 * Math.PI * r;

  let acc = 0;
  const segments = data.filter((d) => d.value > 0).map((d) => {
    const dash = (d.value / total) * circumference;
    const svg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.color || 'var(--teal)'}" stroke-width="${stroke}" stroke-dasharray="${dash} ${circumference - dash}" stroke-dashoffset="${-acc}" />`;
    acc += dash;
    return svg;
  }).join('');

  const legend = data.map((d) => {
    const pct = Math.round((d.value / total) * 100);
    return `
      <div class="donut-legend-item">
        <span class="donut-legend-dot" style="background:${d.color || 'var(--teal)'};"></span>
        <span class="donut-legend-label">${esc(d.label)}</span>
        <span class="donut-legend-value">${esc(String(d.value))}${options.unit ? ` ${options.unit}` : ''} &middot; ${pct}٪</span>
      </div>
    `;
  }).join('');

  return `
    <div class="donut-chart-container">
      <div class="donut-chart-wrap">
        <svg viewBox="0 0 ${size} ${size}" class="donut-chart-svg" style="transform:rotate(-90deg);">
          <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-2)" stroke-width="${stroke}" />
          ${segments}
        </svg>
        <div class="donut-chart-center">
          <div class="donut-chart-total">${total}</div>
          <div class="donut-chart-total-label">إجمالي</div>
        </div>
      </div>
      <div class="donut-legend">${legend}</div>
    </div>
  `;
}

/* ====================== أعمدة عمودية (Vertical Bars) ====================== */
function renderVerticalBarChart(data, opts) {

function sidebar() {
  const groups = [
    { label: 'العمليات اليومية', items: [
      { key: 'dashboard', label: 'المواعيد' },
      { key: 'calendar', label: 'التقويم' },
      { key: 'patients', label: 'المرضى' },
      { key: 'doctors', label: 'الأطباء' },
    ] },
    { label: 'الماليات', items: [
      { key: 'billing', label: 'الفواتير' },
      { key: 'expenses', label: 'الرواتب والمصروفات' },
      { key: 'reports', label: 'التقارير' },
    ] },
    { label: 'النظام', items: [
      { key: 'backup', label: 'نسخة احتياطية' },
      { key: 'activity-log', label: 'سجل النشاط' },
      { key: 'settings', label: 'الإعدادات' },
    ] },
  ];

  const groupsHtml = groups.map((group) => {
    const items = group.items.filter((it) => isPageAllowed(it.key));
    if (items.length === 0) return '';
    return `
      <div class="nav-group-label">${group.label}</div>
      ${items.map((it) => {
        const isActive = state.currentPage === it.key || (it.key === 'patients' && state.currentPage === 'patient-detail');
        return `
        <button class="nav-item ${isActive ? 'active' : ''}" data-page="${it.key}">
          <span class="nav-icon">${navIcons[it.key] || ''}</span>
          <span>${it.label}</span>
        </button>
      `;
      }).join('')}
    `;
  }).join('');

  return `
    <div class="sidebar ${state.sidebarOpen ? 'open' : ''}">
      <div class="sidebar-mobile-head">
        <span>القائمة</span>
        <button type="button" class="sidebar-close-btn" data-action="close-sidebar" aria-label="إغلاق القائمة">✕</button>
      </div>
      ${!isAdmin() ? `<div class="role-hint">صلاحيات محدودة: حجز مواعيد، مرضى، ورواتب/مصروفات فقط</div>` : ''}
      ${groupsHtml}
    </div>
    <div class="sidebar-backdrop ${state.sidebarOpen ? 'show' : ''}" data-action="close-sidebar"></div>
  `;
}

function renderDashboard() {
  const confirmed = state.appointments.filter((a) => a.status === 'confirmed').length;
  const pending = state.appointments.filter((a) => a.status === 'pending').length;
  const total = state.appointments.length || 1;
  const rate = Math.round((confirmed / total) * 100);
  const statusLabel = { confirmed: 'مؤكد', pending: 'في الانتظار', cancelled: 'ملغي' };

  const q = state.apptQuery;
  const statusFilter = state.apptStatusFilter;
  const dateFilter = state.apptDateFilter;
  const filtered = state.appointments.filter((a) => {
    const matchesQuery = a.patientName.includes(q) || getDoctorName(a.doctorId).includes(q) || a.service.includes(q);
    const matchesStatus = statusFilter === 'all' || a.status === statusFilter;
    const matchesDate = dateFilter === 'all'
      || (dateFilter === 'today' && a.dateISO === TODAY_ISO)
      || (dateFilter === 'upcoming' && a.dateISO && a.dateISO >= TODAY_ISO)
      || (dateFilter === 'past' && a.dateISO && a.dateISO < TODAY_ISO);
    return matchesQuery && matchesStatus && matchesDate;
  });

  return `
    <div class="main">
      <div class="topbar">
        <div>
          <h1>مواعيد اليوم</h1>
          <p class="subtitle">الأحد، ٦ سبتمبر ٢٠٢٦</p>
        </div>
        <button class="btn-primary" data-action="open-appointment-modal">+ حجز موعد جديد</button>
      </div>

      <div class="stats">
        <div class="stat"><div class="label">إجمالي المواعيد</div><div class="value">${state.appointments.length}</div></div>
        <div class="stat"><div class="label">في الانتظار</div><div class="value amber">${pending}</div></div>
        <div class="stat"><div class="label">نسبة التأكيد</div><div class="value">${rate}٪</div></div>
      </div>

      <div class="list-toolbar">
        <div class="search-bar">
          <input type="text" id="apptSearch" placeholder="ابحث باسم المريض أو الطبيب أو الخدمة" value="${esc(q)}">
        </div>
        <select id="apptStatusFilter" class="filter-select">
          <option value="all" ${statusFilter === 'all' ? 'selected' : ''}>كل الحالات</option>
          <option value="confirmed" ${statusFilter === 'confirmed' ? 'selected' : ''}>مؤكد</option>
          <option value="pending" ${statusFilter === 'pending' ? 'selected' : ''}>في الانتظار</option>
          <option value="cancelled" ${statusFilter === 'cancelled' ? 'selected' : ''}>ملغي</option>
        </select>
        <select id="apptDateFilter" class="filter-select">
          <option value="all" ${dateFilter === 'all' ? 'selected' : ''}>كل التواريخ</option>
          <option value="today" ${dateFilter === 'today' ? 'selected' : ''}>اليوم فقط</option>
          <option value="upcoming" ${dateFilter === 'upcoming' ? 'selected' : ''}>القادمة</option>
          <option value="past" ${dateFilter === 'past' ? 'selected' : ''}>السابقة</option>
        </select>
      </div>

      <div class="table-card">
        <table class="data-table">
          <thead>
            <tr><th>المريض</th><th>الطبيب</th><th>الخدمة</th><th>نوع الكشف</th><th>الموعد</th><th>الحالة</th><th></th></tr>
          </thead>
          <tbody>
            ${filtered.length === 0 ? `<tr><td colspan="7" class="empty-hint">مفيش مواعيد مطابقة للبحث أو الفلاتر المختارة</td></tr>` :
              filtered.map((a) => `
                <tr>
                  <td>${esc(a.patientName)}</td>
                  <td>${esc(getDoctorName(a.doctorId))}</td>
                  <td>${esc(a.service)}</td>
                  <td>${visitTypeBadge(a.visitType)}</td>
                  <td>${esc(a.date)} — ${esc(a.time)}</td>
                  <td><span class="badge ${a.status}">${statusLabel[a.status]}</span></td>
                  <td>
                    <div class="row-actions">
                      <button class="icon-btn whatsapp-reminder" data-action="whatsapp-appt-reminder" data-id="${a.id}">💬 تذكير بالموعد (واتساب)</button>
                      ${a.status !== 'confirmed' ? `<button class="icon-btn confirm" data-action="confirm-appt" data-id="${a.id}">تأكيد</button>` : ''}
                      ${a.status !== 'cancelled' ? `<button class="icon-btn danger" data-action="cancel-appt" data-id="${a.id}">إلغاء</button>` : ''}
                      ${isAdmin() ? `<button class="icon-btn" data-action="delete-appt" data-id="${a.id}">حذف</button>` : ''}
                    </div>
                  </td>
                </tr>
              `).join('')
            }
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ====================== صفحة التقويم ====================== */
function renderCalendar() {
  const weekStart = state.calendarWeekStart;
  const days = Array.from({ length: 7 }, (_, i) => addDaysISO(weekStart, i));
  const statusLabel = { confirmed: 'مؤكد', pending: 'في الانتظار', cancelled: 'ملغي' };

  return `
    <div class="main">
      <div class="topbar">
        <div>
          <h1>التقويم</h1>
          <p class="subtitle">عرض أسبوعي لمواعيد العيادة</p>
        </div>
        <div class="row-actions">
          <button class="icon-btn" data-action="calendar-prev-week">→ الأسبوع اللي فات</button>
          <button class="icon-btn" data-action="calendar-today">اليوم</button>
          <button class="icon-btn" data-action="calendar-next-week">الأسبوع الجاي ←</button>
        </div>
      </div>

      <div class="calendar-grid">
        ${days.map((iso) => {
          const dayAppts = state.appointments.filter((a) => a.dateISO === iso).sort((a, b) => (a.timeKey || a.time).localeCompare(b.timeKey || b.time));
          return `
            <div class="calendar-day">
              <div class="calendar-day-head">${formatArabicDateShort(iso)}</div>
              <div class="calendar-day-body">
                ${dayAppts.length === 0 ? `<p class="empty-hint" style="padding:14px 6px;">لا توجد مواعيد</p>` :
                  dayAppts.map((a) => `
                    <div class="calendar-appt ${visitTypeBadgeClass(a.visitType)}">
                      <div class="calendar-appt-row">
                        <span class="calendar-appt-time">${esc(a.time)}</span>
                        <span class="calendar-appt-name">${esc(a.patientName)}</span>
                      </div>
                      <div class="calendar-appt-doctor">${esc(getDoctorName(a.doctorId))} &middot; ${esc(a.service)}</div>
                      <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;">
                        <span class="badge ${a.status}">${statusLabel[a.status]}</span>
                        ${a.visitType ? `<span class="badge ${visitTypeBadgeClass(a.visitType)}">${esc(a.visitType)}</span>` : ''}
                      </div>
                    </div>
                  `).join('')
                }
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* ====================== صفحة الفواتير ====================== */
function renderBilling() {
  const nonCancelled = state.appointments.filter((a) => a.status !== 'cancelled');
  const collected = nonCancelled.filter((a) => a.paid).reduce((sum, a) => sum + getServicePrice(a.service), 0);
  const outstanding = nonCancelled.filter((a) => !a.paid).reduce((sum, a) => sum + getServicePrice(a.service), 0);

  const billingQuery = state.billingQuery || '';
  const statusFilter = state.billingStatusFilter;
  const filteredAppts = state.appointments.filter((a) => {
    const matchesQuery = a.patientName.includes(billingQuery) || a.service.includes(billingQuery);
    const matchesStatus = statusFilter === 'all'
      || (statusFilter === 'paid' && a.status !== 'cancelled' && a.paid)
      || (statusFilter === 'unpaid' && a.status !== 'cancelled' && !a.paid)
      || (statusFilter === 'cancelled' && a.status === 'cancelled');
    return matchesQuery && matchesStatus;
  });

  return `
    <div class="main">
      <div class="topbar">
        <div>
          <h1>الفواتير والمدفوعات</h1>
          <p class="subtitle">حالة الدفع لكل موعد بناءً على سعر الخدمة</p>
        </div>
        <div class="row-actions">
          <button class="icon-btn" data-action="export-excel" data-target="billingTable" data-filename="فواتير-${esc(state.settings.clinicName)}">⬇️ Excel</button>
          <button class="icon-btn" data-action="export-pdf" data-target="billingTable" data-filename="فواتير-${esc(state.settings.clinicName)}" data-title="تقرير الفواتير والمدفوعات">⬇️ PDF</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="label">إجمالي المحصّل</div><div class="value">${formatMoney(collected)} جنيه</div></div>
        <div class="stat"><div class="label">إجمالي المعلّق</div><div class="value amber">${formatMoney(outstanding)} جنيه</div></div>
        <div class="stat"><div class="label">عدد الفواتير</div><div class="value">${nonCancelled.length}</div></div>
      </div>

      <div class="list-toolbar">
        <div class="search-bar">
          <input type="text" id="billingSearch" placeholder="ابحث باسم المريض أو الخدمة" value="${esc(billingQuery)}">
        </div>
        <select id="billingStatusFilter" class="filter-select">
          <option value="all" ${statusFilter === 'all' ? 'selected' : ''}>كل الفواتير</option>
          <option value="paid" ${statusFilter === 'paid' ? 'selected' : ''}>مدفوع</option>
          <option value="unpaid" ${statusFilter === 'unpaid' ? 'selected' : ''}>معلّق</option>
          <option value="cancelled" ${statusFilter === 'cancelled' ? 'selected' : ''}>ملغي</option>
        </select>
      </div>

      <div class="table-card" id="billingTable">
        <table class="data-table">
          <thead>
            <tr><th>المريض</th><th>الخدمة</th><th>السعر</th><th>الموعد</th><th>حالة الدفع</th><th class="no-export"></th></tr>
          </thead>
          <tbody>
            ${filteredAppts.length === 0 ? `<tr><td colspan="6" class="empty-hint">مفيش فواتير مطابقة للبحث أو الفلتر المختار</td></tr>` :
              filteredAppts.map((a) => `
                <tr>
                  <td>${esc(a.patientName)}</td>
                  <td>${esc(a.service)}</td>
                  <td class="price-cell">${formatMoney(getServicePrice(a.service))} جنيه</td>
                  <td>${esc(a.date)} — ${esc(a.time)}</td>
                  <td>
                    ${a.status === 'cancelled'
                      ? `<span class="badge cancelled">ملغي — بدون فاتورة</span>`
                      : `<span class="badge ${a.paid ? 'confirmed' : 'pending'}">${a.paid ? 'مدفوع' : 'معلّق'}</span>`}
                  </td>
                  <td class="no-export">
                    <div class="row-actions">
                      ${a.status === 'cancelled' ? '' :
                        `<button class="icon-btn ${a.paid ? '' : 'confirm'}" data-action="toggle-paid" data-id="${a.id}">${a.paid ? 'وضع كمعلّق' : 'تسجيل كمدفوع'}</button>`
                      }
                      ${a.status === 'cancelled' ? '' :
                        `<button class="icon-btn" data-action="download-invoice" data-id="${a.id}">🧾 الفاتورة</button>`
                      }
                    </div>
                  </td>
                </tr>
              `).join('')
            }
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ====================== صفحة الرواتب والمصروفات ====================== */
function renderExpenses() {
  const q = state.expenseQuery;
  const typeFilter = state.expenseTypeFilter;
  const statusFilter = state.expenseStatusFilter;
  const filtered = state.expenses.filter((ex) => {
    const matchesQuery = ex.name.includes(q) || ex.category.includes(q);
    const matchesType = typeFilter === 'all' || ex.type === typeFilter;
    const matchesStatus = statusFilter === 'all' || ex.status === statusFilter;
    return matchesQuery && matchesType && matchesStatus;
  });
  const typeLabel = { salary: 'راتب', expense: 'مصروف' };
  const admin = isAdmin();

  const totalSalaries = state.expenses.filter((ex) => ex.type === 'salary').reduce((sum, ex) => sum + ex.amount, 0);
  const totalExpenses = state.expenses.filter((ex) => ex.type === 'expense').reduce((sum, ex) => sum + ex.amount, 0);
  const grandTotal = totalSalaries + totalExpenses;
  const pendingTotal = state.expenses.filter((ex) => ex.status !== 'paid').reduce((sum, ex) => sum + ex.amount, 0);

  const collectedRevenue = state.appointments.filter((a) => a.status !== 'cancelled' && a.paid).reduce((sum, a) => sum + getServicePrice(a.service), 0);
  const netEstimate = collectedRevenue - grandTotal;

  return `
    <div class="main">
      <div class="topbar">
        <div>
          <h1>الرواتب والمصروفات</h1>
          <p class="subtitle">متابعة رواتب الأطباء والموظفين ومصروفات العيادة</p>
        </div>
        <div class="row-actions">
          <button class="icon-btn" data-action="export-excel" data-target="expensesTable" data-filename="رواتب-ومصروفات-${esc(state.settings.clinicName)}">⬇️ Excel</button>
          <button class="icon-btn" data-action="export-pdf" data-target="expensesTable" data-filename="رواتب-ومصروفات-${esc(state.settings.clinicName)}" data-title="تقرير الرواتب والمصروفات">⬇️ PDF</button>
          ${admin ? `<button class="btn-primary" data-action="open-expense-modal">+ إضافة سجل جديد</button>` : ''}
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="label">إجمالي الرواتب</div><div class="value">${formatMoney(totalSalaries)} جنيه</div></div>
        <div class="stat"><div class="label">إجمالي المصروفات</div><div class="value amber">${formatMoney(totalExpenses)} جنيه</div></div>
        <div class="stat"><div class="label">إجمالي المعلّق للدفع</div><div class="value amber">${formatMoney(pendingTotal)} جنيه</div></div>
      </div>

      <div class="settings-section">
        <h2>الملخص المالي</h2>
        <div class="stats" style="margin-bottom:0;">
          <div class="stat"><div class="label">إجمالي الإيرادات المحصّلة</div><div class="value">${formatMoney(collectedRevenue)} جنيه</div></div>
          <div class="stat"><div class="label">إجمالي الرواتب والمصروفات</div><div class="value amber">${formatMoney(grandTotal)} جنيه</div></div>
          <div class="stat"><div class="label">صافي الربح التقديري</div><div class="value">${formatMoney(netEstimate)} جنيه</div></div>
        </div>
      </div>

      <div class="list-toolbar">
        <div class="search-bar">
          <input type="text" id="expenseSearch" placeholder="ابحث بالاسم أو الفئة" value="${esc(q)}">
        </div>
        <select id="expenseTypeFilter" class="filter-select">
          <option value="all" ${typeFilter === 'all' ? 'selected' : ''}>كل الأنواع</option>
          <option value="salary" ${typeFilter === 'salary' ? 'selected' : ''}>رواتب</option>
          <option value="expense" ${typeFilter === 'expense' ? 'selected' : ''}>مصروفات</option>
        </select>
        <select id="expenseStatusFilter" class="filter-select">
          <option value="all" ${statusFilter === 'all' ? 'selected' : ''}>كل الحالات</option>
          <option value="paid" ${statusFilter === 'paid' ? 'selected' : ''}>مدفوع</option>
          <option value="pending" ${statusFilter === 'pending' ? 'selected' : ''}>معلّق</option>
        </select>
      </div>

      <div class="table-card" id="expensesTable">
        <table class="data-table">
          <thead>
            <tr><th>البيان</th><th>النوع</th><th>الفئة</th><th>المبلغ</th><th>التاريخ</th><th>حالة الدفع</th><th class="no-export"></th></tr>
          </thead>
          <tbody>
            ${filtered.length === 0 ? `<tr><td colspan="7" class="empty-hint">مفيش سجلات رواتب أو مصروفات مطابقة للبحث أو الفلاتر</td></tr>` :
              filtered.map((ex) => `
                <tr>
                  <td>${esc(ex.name)}</td>
                  <td><span class="badge ${ex.type}">${typeLabel[ex.type]}</span></td>
                  <td>${esc(ex.category || '—')}</td>
                  <td class="price-cell">${formatMoney(ex.amount)} جنيه</td>
                  <td>${esc(ex.date)}</td>
                  <td><span class="badge ${ex.status === 'paid' ? 'confirmed' : 'pending'}">${ex.status === 'paid' ? 'مدفوع' : 'معلّق'}</span></td>
                  <td class="no-export">
                    <div class="row-actions">
                      <button class="icon-btn ${ex.status === 'paid' ? '' : 'confirm'}" data-action="toggle-expense-paid" data-id="${ex.id}">${ex.status === 'paid' ? 'وضع كمعلّق' : 'تسجيل كمدفوع'}</button>
                      ${admin ? `<button class="icon-btn" data-action="open-expense-modal" data-id="${ex.id}">تعديل</button>` : ''}
                      ${admin ? `<button class="icon-btn danger" data-action="delete-expense" data-id="${ex.id}">حذف</button>` : ''}
                    </div>
                  </td>
                </tr>
              `).join('')
            }
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ====================== صفحة التقارير ====================== */
function renderReports() {
  const total = state.appointments.length;
  const confirmed = state.appointments.filter((a) => a.status === 'confirmed').length;
  const pending = state.appointments.filter((a) => a.status === 'pending').length;
  const cancelled = state.appointments.filter((a) => a.status === 'cancelled').length;
  const cancelRate = total ? Math.round((cancelled / total) * 100) : 0;
  const revenue = state.appointments.filter((a) => a.status !== 'cancelled' && a.paid).reduce((sum, a) => sum + getServicePrice(a.service), 0);

  const serviceCounts = {};
  state.appointments.forEach((a) => { serviceCounts[a.service] = (serviceCounts[a.service] || 0) + 1; });
  const topServices = Object.entries(serviceCounts).sort((a, b) => b[1] - a[1]);

  const doctorCounts = {};
  state.appointments.forEach((a) => {
    const name = getDoctorName(a.doctorId);
    doctorCounts[name] = (doctorCounts[name] || 0) + 1;
  });
  const doctorBreakdown = Object.entries(doctorCounts).sort((a, b) => b[1] - a[1]);

  return `
    <div class="main">
      <div class="topbar">
        <div>
          <h1>التقارير والإحصائيات</h1>
          <p class="subtitle">نظرة عامة على أداء العيادة بناءً على كل البيانات المسجلة</p>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><div class="label">إجمالي الإيرادات المحصّلة</div><div class="value">${formatMoney(revenue)} جنيه</div></div>
        <div class="stat"><div class="label">إجمالي المواعيد</div><div class="value">${total}</div></div>
        <div class="stat"><div class="label">نسبة الإلغاء</div><div class="value amber">${cancelRate}٪</div></div>
      </div>

      <div class="settings-section">
        <h2>حالة المواعيد</h2>
        <div class="stats" style="margin-bottom:18px;">
          <div class="stat"><div class="label">مؤكدة</div><div class="value">${confirmed}</div></div>
          <div class="stat"><div class="label">في الانتظار</div><div class="value amber">${pending}</div></div>
          <div class="stat"><div class="label">ملغاة</div><div class="value">${cancelled}</div></div>
        </div>
        ${renderDonutChart([
          { label: 'مؤكدة', value: confirmed, color: 'var(--teal)' },
          { label: 'في الانتظار', value: pending, color: 'var(--amber)' },
          { label: 'ملغاة', value: cancelled, color: 'var(--rust)' },
        ])}
      </div>

      <div class="settings-section">
        <h2>أكتر الخدمات طلبًا</h2>
        ${renderVerticalBarChart(topServices.slice(0, 8).map(([name, count]) => ({ label: name, value: count })))}
      </div>

      <div class="settings-section">
        <h2>عدد المواعيد لكل طبيب</h2>
        ${renderVerticalBarChart(doctorBreakdown.map(([name, count]) => ({ label: name, value: count, color: 'var(--amber)' })))}
      </div>

      <div class="settings-section">
        <h2>تفاصيل الخدمات (جدول)</h2>
        <div class="table-card">
          <table class="data-table">
            <thead><tr><th>الخدمة</th><th>عدد المواعيد</th></tr></thead>
            <tbody>
              ${topServices.length === 0 ? `<tr><td colspan="2" class="empty-hint">مفيش بيانات كفاية</td></tr>` :
                topServices.map(([name, count]) => `<tr><td>${esc(name)}</td><td>${count}</td></tr>`).join('')
              }
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

/* ====================== صفحة سجل النشاط ====================== */
function renderActivityLog() {
  return `
    <div class="main">
      <div class="topbar">
        <div>

function renderBooking() {
  if (state.booking.done) {
    return `
      <div class="booking-page">
        <div class="booking-wrap">
          <div class="success-box">
            <h3>تم إرسال طلب الحجز</h3>
            <p>هيتم تأكيد الموعد من العيادة قريبًا، وهتلاقيه في جدول المواعيد.</p>
            <button class="btn-primary" data-action="booking-new">حجز موعد تاني</button>
          </div>
        </div>
      </div>
    `;
  }

  const services = state.services.map((sv) => sv.name);
  const activeDoctors = getActiveDoctors();
  const selectedDoctor = activeDoctors.find((d) => d.id === state.booking.doctorId);

  // نطاق الساعات المعروض بيتحدد حسب مواعيد عمل الطبيب المختار (لو متاح)، وإلا بيرجع للنطاق الافتراضي
  const defaultStartHour = 9, defaultEndHour = 21;
  const doctorStartHour = selectedDoctor ? parseInt((selectedDoctor.workingFrom || '09:00').split(':')[0], 10) : defaultStartHour;
  const doctorEndHour = selectedDoctor ? parseInt((selectedDoctor.workingTo || '21:00').split(':')[0], 10) : defaultEndHour;
  const hours = Array.from({ length: 12 }, (_, i) => i + 9).filter((h) => h >= doctorStartHour && h <= doctorEndHour);
  const minutes = ['00', '15', '30', '45'];
  const periods = ['ص', 'م'];

  // تنبيه لو اليوم المختار مش من ضمن أيام عمل الطبيب المختار
  const selectedDayName = dateISOToArabicDayName(state.booking.dateValue);
  const doctorDayMismatch = selectedDoctor && selectedDayName && selectedDoctor.workingDays && selectedDoctor.workingDays.length
    ? !selectedDoctor.workingDays.includes(selectedDayName) : false;

  return `
    <div class="booking-page">
      <div class="booking-wrap">
        <div class="booking-header">
          <h1>احجز موعدك</h1>
          <p>اختر الطبيب والموعد المناسب لك في أقل من دقيقة</p>
        </div>

        <p class="section-label">اختر نوع الكشف</p>
        <div class="service-grid">
          ${VISIT_TYPES.map((v) => `
            <button class="service-card ${state.booking.visitType === v.value ? 'selected' : ''}" data-action="select-visit-type" data-value="${esc(v.value)}" title="${esc(v.hint)}">
              <div class="service-icon">${v.icon}</div>
              <div class="service-name">${esc(v.value)}</div>
            </button>
          `).join('')}
        </div>

        <p class="section-label">اختر الخدمة</p>
        <div class="service-grid">
          ${services.map((s, idx) => `
            <button class="service-card ${state.booking.service === s ? 'selected' : ''}" data-action="select-service" data-value="${esc(s)}">
              <div class="service-icon">${idx === 0 ? '🩺' : '📋'}</div>
              <div class="service-name">${esc(s)}</div>
            </button>
          `).join('')}
        </div>

        <p class="section-label">اختر الطبيب</p>
        <div class="card-list">
          ${activeDoctors.length === 0 ? `<p class="empty-hint">مفيش أطباء متاحين</p>` :
            activeDoctors.map((d) => `
              <button class="doctor-card ${state.booking.doctorId === d.id ? 'selected' : ''}" data-action="select-doctor" data-id="${d.id}">
                <div class="avatar">${esc(d.initials)}</div>
                <div><h3>${esc(d.name)}</h3><p>${esc(d.specialty)}</p><p style="font-size:11px;color:var(--text-2);margin-top:2px;">مواعيده: ${esc(getDoctorScheduleLabel(d))}</p></div>
              </button>
            `).join('')
          }
        </div>

        <p class="section-label">اختر التاريخ</p>
        <div class="form-group">
          <input type="date" id="bookingDate" value="${state.booking.dateValue || ''}">
          ${doctorDayMismatch ? `<p style="font-size:12px;color:var(--rust-text);margin-top:6px;">${esc(selectedDoctor.name)} مش متاح يوم ${esc(selectedDayName)}. أيام عمله: ${esc(selectedDoctor.workingDays.join('، '))}</p>` : ''}
        </div>

        <p class="section-label">اختر الوقت${selectedDoctor ? ` (مواعيد ${esc(selectedDoctor.name)} من ${esc(selectedDoctor.workingFrom || '09:00')} إلى ${esc(selectedDoctor.workingTo || '21:00')})` : ''}</p>
        <div class="time-picker-group">
          <div class="time-picker-row">
            <div class="time-input-wrapper">
              <label>الساعة</label>
              <select id="bookingHour" class="time-select">
                <option value="">--</option>
                ${hours.map((h) => `<option value="${h}" ${state.booking.hour == h ? 'selected' : ''}>${String(h).padStart(2, '0')}</option>`).join('')}
              </select>
            </div>
            <div class="time-separator">:</div>
            <div class="time-input-wrapper">
              <label>الدقيقة</label>
              <select id="bookingMinute" class="time-select">
                <option value="">--</option>
                ${minutes.map((m) => `<option value="${m}" ${state.booking.minute === m ? 'selected' : ''}>${m}</option>`).join('')}
              </select>
            </div>
            <div class="time-separator"></div>
            <div class="time-input-wrapper">
              <label>الفترة</label>
              <select id="bookingPeriod" class="time-select">
                <option value="">--</option>
                ${periods.map((p) => `<option value="${p}" ${state.booking.period === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>الاسم بالكامل</label>
          <input type="text" id="bookingName" placeholder="محمد عبد الله" value="${esc(state.booking.name || '')}">
        </div>
        <div class="form-group">
          <label>رقم الموبايل</label>
          <input type="tel" id="bookingPhone" placeholder="01xxxxxxxxx" value="${esc(state.booking.phone || '')}">
        </div>

        <div class="summary-card">
          <h3>ملخص الحجز</h3>
          <div class="row"><span>نوع الكشف</span><span>${state.booking.visitType ? esc(state.booking.visitType) : '—'}</span></div>
          <div class="row"><span>الخدمة</span><span>${state.booking.service ? esc(state.booking.service) : '—'}</span></div>
          <div class="row"><span>الطبيب</span><span>${selectedDoctor ? esc(selectedDoctor.name) : '—'}</span></div>
          <div class="row"><span>التاريخ</span><span>${state.booking.dateLabel || '—'}</span></div>
          <div class="row"><span>الوقت</span><span>${(state.booking.hour && state.booking.minute && state.booking.period) ? `${state.booking.hour}:${state.booking.minute} ${state.booking.period}` : '—'}</span></div>
        </div>

        <button class="confirm-btn" data-action="confirm-booking">✓ تأكيد الحجز</button>
      </div>
    </div>
  `;
}
